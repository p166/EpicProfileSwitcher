name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build executable
        shell: pwsh
        run: .\build-windows.ps1

      - name: Generate update checksum
        shell: pwsh
        run: |
          $executable = "dist/windows/EpicProfileSwitcher.exe"
          $hash = (Get-FileHash $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$executable.sha256" -Value $hash -NoNewline -Encoding ascii

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/windows/EpicProfileSwitcher.exe
            dist/windows/EpicProfileSwitcher.exe.sha256
          fail_on_unmatched_files: true
