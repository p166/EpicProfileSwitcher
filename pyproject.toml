[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-profile-switcher"
description = "A small Windows GUI for switching Epic Games Launcher profiles"
requires-python = ">=3.10"
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
build = ["PyInstaller>=6.10,<7"]

[project.scripts]
epic-profile-switcher = "epic_profile_switcher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epic_profile_switcher = ["app.ico"]

[tool.setuptools.dynamic]
version = {attr = "epic_profile_switcher.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]